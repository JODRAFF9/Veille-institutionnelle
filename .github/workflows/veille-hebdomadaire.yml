name: Veille hebdomadaire

on:
  schedule:
    - cron: "17 5 * * 1"   # chaque lundi, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install openpyxl

      - name: Vérifier les liens
        run: python3 outils/verifier_liens.py rapport.md

      - name: Ouvrir l'issue de la semaine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Routine de la semaine"
            echo
            echo "- [ ] Consulter le calendrier des publications (\`veille/calendrier-veille.xlsx\`)"
            echo "- [ ] Médiathèque Banque mondiale : blog des données ouvertes, pages thématiques"
            echo "- [ ] Médiathèque FMI : blogs, vidéos, podcasts, actualités de data.imf.org"
            echo "- [ ] Contrôler \`lastupdated\` de l'API de la Banque mondiale et le millésime du WEO"
            echo "- [ ] Consigner les changements dans le journal de veille"
            echo "- [ ] Mettre à jour \`outils/donnees_veille.py\` puis régénérer si un chiffre est dépassé"
            echo
            echo "## Contrôle des liens"
            echo
            cat rapport.md
          } > issue.md
          gh issue create --repo "${{ github.repository }}" \
            --title "Veille de la semaine du $(date -u +%F)" \
            --body-file issue.md
